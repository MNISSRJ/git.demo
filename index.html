<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee8de"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="纸卡"><link rel="manifest" href="manifest.json"><title>纸卡</title><style>body{margin:0;background:#eee8de;color:#292724;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:720px;margin:auto;padding:24px 18px}.brand{font:700 28px Georgia,serif;margin-bottom:18px}.deck{display:flex;gap:8px;overflow:auto}.deck button{border:1px solid #d7cfc2;background:#f8f3eb;border-radius:20px;padding:9px 13px}.deck .active{background:#292724;color:#fff}.info{display:flex;justify-content:space-between;margin:18px 0 12px}.stage{height:430px;display:flex;align-items:center;justify-content:center;perspective:1200px}.card{width:min(100%,620px);height:360px;position:relative;transform-style:preserve-3d;transition:transform .58s cubic-bezier(.2,.75,.2,1);filter:drop-shadow(0 22px 22px #554b3b26)}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:9px;background:#fffdf8;border:1px solid #d9d0c2;padding:30px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.face:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#d9d2c7 4px 5px),repeating-linear-gradient(90deg,transparent 0 6px,#eee9e1 6px 7px);opacity:.22}.back{transform:rotateY(180deg);background:#fbf7ef}.tag{position:absolute;top:20px;left:25px;font-size:10px;letter-spacing:.16em;color:#aaa093;z-index:2}.word,.meaning{position:relative;z-index:2;font-family:Georgia,"Songti SC",serif}.word{font-size:40px}.meaning{font-size:25px;line-height:1.5}.tip{position:absolute;bottom:20px;color:#aaa093;font-size:11px;z-index:2}.actions{text-align:center}.actions button{border:1px solid #d5ccbf;background:#fffaf2;border-radius:14px;padding:12px 20px;margin:0 4px}.main{background:#292724!important;color:white}.empty{text-align:center;color:#8d8478}.add{margin-top:18px;width:100%;padding:12px;border:1px dashed #b9ad9e;border-radius:12px;background:transparent}</style></head><body><div class="app"><div class="brand">纸卡 <span style="font:11px sans-serif;color:#948b7e">PAPER CARDS</span></div><div class="deck" id="decks"></div><div class="info"><b id="title"></b><span id="count"></span></div><div class="stage" id="stage"></div><div class="actions"><button onclick="prev()">‹</button><button class="main" onclick="flip()">翻面</button><button onclick="next()">›</button></div><button class="add" onclick="addCard()">＋ 添加纸卡</button></div><script>const seed=[{name:'英语 · 高频词',cards:[['grocer','食品杂货商；食品杂货店老板'],['influence','影响；对……产生影响'],['vary','变化；各地区差异很大'],['sustain','维持；保持；使持续']]},{name:'数学分析',cards:[['可微','函数在一点附近可以用线性函数很好地近似。']]}];let decks=JSON.parse(localStorage.paperCards||'null')||seed,di=0,ci=0,fl=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.paperCards=JSON.stringify(decks)}function render(){document.getElementById('decks').innerHTML=decks.map((d,i)=>`<button class="${i==di?'active':''}" onclick="sel(${i})">${esc(d.name)} · ${d.cards.length}</button>`).join('');let d=decks[di],c=d.cards[ci];document.getElementById('title').textContent=d.name;document.getElementById('count').textContent=d.cards.length?`${ci+1} / ${d.cards.length}`:'0 / 0';if(!c){document.getElementById('stage').innerHTML='<div class="empty">这个牌组还没有纸卡。</div>';return}document.getElementById('stage').innerHTML=`<div class="card ${fl?'flip':''}" id="card"><div class="face"><span class="tag">FRONT</span><div class="word">${esc(c[0])}</div><span class="tip">翻面查看答案</span></div><div class="face back"><span class="tag">BACK</span><div class="meaning">${esc(c[1])}</div></div></div>`}function flip(){fl=!fl;document.getElementById('card')?.classList.toggle('flip',fl)}function next(){if(!decks[di].cards.length)return;ci=(ci+1)%decks[di].cards.length;fl=false;render()}function prev(){if(!decks[di].cards.length)return;ci=(ci-1+decks[di].cards.length)%decks[di].cards.length;fl=false;render()}function sel(i){di=i;ci=0;fl=false;render()}function addCard(){let f=prompt('正面');if(!f)return;let b=prompt('背面');if(!b)return;decks[di].cards.push([f,b]);persist();render()}document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>
